openapi: 3.0.3
info:
  title: Student API
  description: API สำหรับจัดการข้อมูลนิสิต พัฒนาในรายวิชา 88736065
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Development server
paths:
  /auth/register:
    post:
      summary: ลงทะเบียน
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: สมัครสมาชิกสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
        "400":
          description: ข้อมูลไม่ผ่านการตรวจสอบ (validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: อีเมลมีอยู่ในระบบแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicationErrorResponse"
  /auth/login:
    post:
      summary: เข้าสู่ระบบ
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "400":
          description: ข้อมูลไม่ผ่านการตรวจสอบ (validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: อีเมลหรือรหัสผ่านไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidErrorResponse"
  /auth/me:
    get:
      summary: ดูข้อมูลของตัวเอง
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ดึงข้อมูลตัวเองสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
  /students:
    get:
      summary: ดึงรายการนิสิตทั้งหมด
      tags:
        - Students
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: หมายเลขหน้าที่ต้องการ
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: จำนวนรายการต่อหน้า
        - name: major
          in: query
          schema:
            type: string
          description: สาขาที่ต้องการ
        - name: field
          in: query
          schema:
            type: string
          description: กรองตามสิ่งที่ต้องการ
        - name: order
          in: query
          schema:
            type: string
          description: จัดเรียงตามที่ต้องการ
      responses:
        "200":
          description: สำเร็จ คืนรายการนิสิตพร้อมข้อมูล pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"
    post:
      summary: สร้างนิสิตใหม่
      tags:
        - Students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPostResponse"
        "400":
          description: ข้อมูลไม่ผ่านการตรวจสอบ (validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: อีเมลมีอยู่ในระบบแล้ว
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicationErrorResponse"
  /students/{id}:
    put:
      summary: แก้ไขข้อมูลนิสิตทั้งหมดตาม id
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "200":
          description: แก้ไขข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPutResponse"
        "400":
          description: ข้อมูลไม่ผ่านการตรวจสอบ (validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: ไม่มีสิทธิ์ลบข้อมูล (ต้องเป็น role admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: ไม่พบนิสิตตาม id ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
    delete:
      summary: ลบข้อมูลนิสิตตาม id
      tags:
        - Students
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDeleteResponse"
        "403":
          description: ไม่มีสิทธิ์ลบข้อมูล (ต้องเป็น role admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        "404":
          description: ไม่พบนิสิตตาม id ที่ระบุ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: จองกุก
        major:
          type: string
          example: ITDI
        email:
          type: string
          example: jk@example.com
    StudentInput:
      type: object
      required:
        - name
        - major
        - email
      properties:
        name:
          type: string
          example: "จองกุก"
        major:
          type: string
          example: "ITDI"
        email:
          type: string
          example: "jk@example.com"
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
    AuthInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: jk@example.com
        password:
          type: string
          example: PassWord!
    AuthRegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              example: jk@example.com
            role:
              type: string
              example: student
    AuthLoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: "เข้าสู่ระบบสำเร็จ"
            token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwiZW1haWwiOiJqa0BleGFtcGxlLmNvbSIsInJvbGUiOiJzdHVkZW50IiwiaWF0IjoxNjMyNzYxMjM0LCJleHAiOjE2MzI4NDc2MzR9.Xyz123ABCdefGHIjklMNOpqrSTUvwxYZ"
    AuthMeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: "สำเร็จ"
            item:
              $ref: "#/components/schemas/Student"
    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "กรุณาระบุ email และ password"
    DuplicationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "DUPLICATE_EMAIL"
            message:
              type: string
              example: "อีเมลนี้มีอยู่ในระบบแล้ว"
    InvalidErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "INVALID_CREDENTIALS"
            message:
              type: string
              example: "อีเมลหรือรหัสผ่านไม่ถูก"
    StudentPostResponse:
      type: object
      properties:
        message:
          type: string
          example: "เพิ่มข้อมูลสำเร็จ"
        data:
          $ref: "#/components/schemas/Student"
    StudentPutResponse:
      type: object
      properties:
        message:
          type: string
          example: "แก้ไขข้อมูลสำเร็จ"
        data:
          $ref: "#/components/schemas/Student"
    StudentDeleteResponse:
      type: object
      properties:
        message:
          type: string
          example: "ลบข้อมูลสำเร็จ"
    StudentListResponse:
      type: object
      properties:
        message:
          type: string
          example: "ดึงข้อมูลสำเร็จ"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            totalItems:
              type: integer
            totalPage:
              type: integer
    ForbiddenErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "FORBIDDEN"
            message:
              type: string
              example: "แก้ไขได้เฉพาะข้อมูลของตนเอง"
    NotFoundErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "NOT_FOUND"
            message:
              type: string
              example: "ไม่พบข้อมูลนิสิต"
